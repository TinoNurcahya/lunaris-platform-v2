name: Keep Supabase Alive

on:
  schedule:
    # Runs every 3 days at 04:00 UTC to prevent Supabase Free Tier 7-day auto-pause
    - cron: '0 4 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions dashboard

permissions:
  contents: write

jobs:
  keep-alive:
    name: Ping Health Check & Keep Database Active
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Ping Lunarys Health Endpoint
        env:
          TARGET_URL: ${{ secrets.HEALTH_CHECK_URL || 'https://lunarys-platform.vercel.app/api/health' }}
        run: |
          echo "Pinging health endpoint: $TARGET_URL"
          RESPONSE=$(curl -s -w "\n%{http_code}" --retry 3 --retry-delay 5 "$TARGET_URL")
          HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)

          echo "HTTP Status: $HTTP_STATUS"
          echo "Response Body: $HTTP_BODY"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Health check failed with HTTP status $HTTP_STATUS"
            exit 1
          fi

          if echo "$HTTP_BODY" | grep -q '"status":"ok"'; then
            echo "Database connection is healthy and active. Inactivity timer reset."
          else
            echo "::warning::Health endpoint responded 200, but status was not 'ok'."
          fi

      - name: Prevent GitHub Actions Scheduled Workflow Inactivity Pause
        run: |
          # GitHub disables scheduled workflows after 60 days of repository inactivity (no commits).
          # If the last commit is older than 45 days, create a lightweight keepalive commit.
          LAST_COMMIT_DATE=$(git log -1 --format=%ct)
          CURRENT_DATE=$(date +%s)
          DAYS_ELAPSED=$(( (CURRENT_DATE - LAST_COMMIT_DATE) / 86400 ))

          echo "Days since last commit: $DAYS_ELAPSED"

          if [ "$DAYS_ELAPSED" -ge 45 ]; then
            echo "Repository has been inactive for $DAYS_ELAPSED days. Creating keepalive commit to maintain cron schedule..."
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive.txt
            git add .github/keepalive.txt
            git commit -m "chore: prevent scheduled workflow auto-pause [skip ci]"
            git push || echo "::warning::Unable to push keepalive commit. Please verify workflow write permissions in repository settings."
          else
            echo "Repository active within the last 45 days. No keepalive commit needed."
          fi

